[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latedeliveries"
version = "0.1.0"
description = "Lab 05 - Predicting Late Food Delivery Orders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas",
    "matplotlib",
    "joblib"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]